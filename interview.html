<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conversational AI Interview Bot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
          colors: { sky: { 500: '#0ea5e9', 600: '#0284c7' } }
        }
      }
    }
    // PDF.js worker setup
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
  </script>
  <link rel="stylesheet" href="coach.css" />
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <header class="bg-slate-900 text-white border-b border-slate-800 shadow-sm sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="coach.html" class="hover:text-sky-400 transition"><i class="fa-solid fa-arrow-left mr-2"></i>Back to Coach</a>
        <div class="ml-4 font-bold tracking-wider text-base text-sky-400">INTERVIEW BOT</div>
      </div>
      <div class="flex items-center space-x-4">
        <div id="statusIndicator" class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-300 border border-slate-700">
          <span id="statusDot" class="w-2 h-2 rounded-full bg-slate-400"></span>
          <span id="statusText">System Ready</span>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    
    <!-- Setup Phase -->
    <div id="setupPhase" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-xl font-bold text-slate-800 mb-4">Phase 1: Configure Interview</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Enter a Specific Topic</label>
          <input type="text" id="topicInput" placeholder="e.g., React Hooks, Python Data Science" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500" />
        </div>
        <div class="text-center font-bold text-slate-400">OR</div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Upload CV (PDF)</label>
          <input type="file" id="cvInput" accept=".pdf" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100" />
        </div>
        <button id="btnGeneratePlan" class="w-full mt-4 py-3 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-lg transition shadow-md">
          <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Generate Interview Master Plan
        </button>
        <p id="setupLog" class="text-xs text-slate-500 mt-2 text-center"></p>
      </div>
    </div>

    <!-- Interview Phase (Hidden initially) -->
    <div id="interviewPhase" class="hidden space-y-6">
      
      <!-- Current Topic Banner -->
      <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-xl flex justify-between items-center">
        <div>
          <span class="text-xs font-bold text-indigo-400 uppercase tracking-wider">Current Topic</span>
          <h3 id="displayTopic" class="text-lg font-bold text-indigo-900">...</h3>
        </div>
        <button id="btnSkipTopic" class="px-4 py-2 bg-white border border-slate-300 text-slate-700 text-sm font-semibold rounded-lg hover:bg-slate-50 transition">
          Skip Topic <i class="fa-solid fa-forward-step ml-1"></i>
        </button>
      </div>

      <!-- Dialogue Area -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <div class="mb-6">
          <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Interviewer</span>
          <p id="displayQuestion" class="text-xl font-medium text-slate-800 mt-1">Generating your first question...</p>
        </div>

        <div class="flex items-center justify-center space-x-4 border-t border-slate-100 pt-6">
          <button id="btnStartSpeaking" class="px-6 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-full transition shadow-md flex items-center">
            <i class="fa-solid fa-microphone mr-2"></i> Start Answering
          </button>
          <button id="btnStopSpeaking" class="hidden px-6 py-3 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-full transition shadow-md flex items-center animate-pulse">
            <i class="fa-solid fa-stop mr-2"></i> Finish Answer
          </button>
        </div>
        
        <div class="mt-4 text-center">
          <p id="liveTranscript" class="text-sm text-slate-500 italic min-h-[1.25rem]"></p>
        </div>
      </div>

      <!-- Action Footer -->
      <div class="flex justify-end">
        <button id="btnDownloadTranscript" class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white text-sm font-semibold rounded-lg transition shadow-sm">
          <i class="fa-solid fa-download mr-1"></i> Download Raw Transcript
        </button>
      </div>

    </div>
  </main>

  <script src="env.js"></script> <!-- Assuming this holds GEMINI_API_KEY -->
  <script src="interview.js"></script>
</body>
</html>
